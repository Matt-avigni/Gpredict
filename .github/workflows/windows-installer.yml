name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - GpredictV2-V3
    tags:
      - 'v*'

jobs:
  build-windows-installer:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute app version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && -n "${GITHUB_REF_NAME:-}" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git describe --tags --always --match='v*' HEAD 2>/dev/null || git rev-parse --short HEAD)"
            version="${version#v}"
            version="${version%-dirty}"
          fi
          printf 'GPREDICT_APP_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Export pinned Hamlib source
        shell: bash
        run: grep -E '^[A-Z_][A-Z0-9_]*=' packaging/windows/hamlib-source.env >> "$GITHUB_ENV"

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            autoconf
            automake-wrapper
            git
            intltool
            libtool
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-goocanvas
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-gsettings-desktop-schemas
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-nsis

      - name: Verify MSYS2 build tools
        run: |
          set -euo pipefail
          for tool in bash git autoreconf pkg-config gcc make ntldd makensis zip glib-compile-schemas gdk-pixbuf-query-loaders nproc; do
            command -v "$tool"
          done
          git --version
          gcc --version | head -n 1
          makensis -VERSION

      - name: Clone pinned Hamlib fork
        run: |
          git clone --depth 1 --branch "$HAMLIB_REF" "https://github.com/${HAMLIB_REPOSITORY}.git" hamlib-src
          actual="$(git -C hamlib-src rev-parse HEAD)"
          if [[ "$actual" != "$HAMLIB_EXPECTED_COMMIT" ]]; then
            echo "Expected Hamlib commit $HAMLIB_EXPECTED_COMMIT from ${HAMLIB_REPOSITORY}/${HAMLIB_REF}, got $actual" >&2
            exit 1
          fi

      - name: Build installer
        run: |
          set -euo pipefail
          sed -i 's/\r$//' packaging/windows/build-installer.sh packaging/windows/hamlib-source.env
          bash ./packaging/windows/build-installer.sh

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: gpredict-windows-installer
          path: build/windows-ucrt64/artifacts/*
          if-no-files-found: error
